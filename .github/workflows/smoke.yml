name: smoke

on: workflow_dispatch

permissions:
  contents: read

jobs:
  check:
    runs-on: [self-hosted, scholar]
    steps:
      - name: Herramientas
        run: |
          node -v
          npm -v
          trivy --version
          semgrep --version

      - name: Acceso a web
        run: ssh web 'whoami && hostname && touch /srv/scholar/web/.deploy-test && echo escritura-ok'

      - name: Acceso a app y reinicio del servicio
        run: |
          ssh app 'whoami && hostname'
          ssh app 'sudo -n systemctl restart scholar-api && systemctl is-active scholar-api'

      - name: Sudo limitado (debe fallar)
        run: |
          if ssh app 'sudo -n systemctl stop scholar-api' 2>/dev/null; then
            echo "ERROR: deploy tiene más sudo del que debería"; exit 1
          else
            echo "sudo limitado correctamente"
          fi